name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: docker compose config -q
      # An empty `content` makes compose bind-mount its working directory into derper: never allow it.
      - name: derper debug key config is never empty nor a file
        run: |
          set -o pipefail
          env -u DERPER_DEBUG_KEY docker compose config --format json |
            jq -e '.configs["derper-debug-key"] | (.content // "") != "" and .file == null and .environment == null'
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -tags e2e ./e2e -run 'TestFleetsAreIsolated|TestDerperAdmission|TestRelayedTrafficIsMetered' -v -timeout 40m
