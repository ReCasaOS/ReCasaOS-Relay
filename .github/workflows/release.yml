name: release

# Builds the `enrolment` and `derper` images and pushes them to GHCR when a version tag is pushed.
# Images: ghcr.io/<owner>/<repository>-enrolment and -derper, lowercased (for this repository
# ghcr.io/recasaos/recasaos-relay-enrolment and ghcr.io/recasaos/recasaos-relay-derper), tagged with the
# git tag and, for a final release, `latest`.
# Only the built-in GITHUB_TOKEN is used; the only actions are actions/checkout@v4 and
# actions/setup-go@v5 (first-party, pinned by major version tag, like ci.yml); the image is built with plain `docker`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag must be on main
        env:
          TAG_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$TAG_SHA" origin/main || { echo "tagged commit is not on main" >&2; exit 1; }
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Build and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # <image suffix> <build context>. Build every image before pushing any: a failed build must not
          # leave a half-published release (one image pushed, `latest` moved).
          pairs=("enrolment ." "derper ./derper")
          for pair in "${pairs[@]}"; do
            read -r name context <<<"$pair"
            image="ghcr.io/${GITHUB_REPOSITORY,,}-$name"
            tags=(-t "$image:$VERSION")
            # A pre-release tag (v1.2.0-rc1) must not move `latest`.
            case "$VERSION" in *-*) ;; *) tags+=(-t "$image:latest") ;; esac
            docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.version=$VERSION" "${tags[@]}" "$context"
          done
          for pair in "${pairs[@]}"; do
            read -r name _ <<<"$pair"
            docker push --all-tags "ghcr.io/${GITHUB_REPOSITORY,,}-$name"
          done
