<!doctype html>
<html lang="{{.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
{{.Marker}}
<style>
:root { --bg:#f3f5f9; --fg:#0f172a; --mut:#5b6678; --line:rgba(15,23,42,.12); --card:#fff; --field:#fff; --accent:#2563eb; --accentbg:rgba(37,99,235,.12); --bad:#b91c1c; --badbg:rgba(239,68,68,.12); --ok:#15803d; --okbg:rgba(34,197,94,.14); --warn:#b45309; }
@media (prefers-color-scheme: dark) { :root { --bg:#0b1220; --fg:#f1f5f9; --mut:#a3b1c6; --line:rgba(255,255,255,.14); --card:rgba(255,255,255,.04); --field:#0b1220; --accent:#3b82f6; --accentbg:rgba(59,130,246,.16); --bad:#fca5a5; --badbg:rgba(239,68,68,.12); --ok:#4ade80; --okbg:rgba(34,197,94,.16); --warn:#fbbf24; } }
* { box-sizing:border-box; }
body { font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--fg); max-width:26rem; margin:0 auto; padding:3.5rem 1.25rem 1.5rem; }
.brand { display:flex; align-items:center; gap:.75rem; margin-bottom:1.25rem; }
.tile { display:flex; align-items:center; justify-content:center; flex-shrink:0; width:3rem; height:3rem; border-radius:.875rem; background:var(--accentbg); color:var(--accent); }
.brand span { display:block; font-size:.8rem; color:var(--mut); }
.brand b { display:block; font-size:.8rem; font-weight:600; color:var(--mut); }
.card { border:1px solid var(--line); border-radius:1rem; background:var(--card); padding:1.25rem; display:flex; flex-direction:column; gap:.875rem; }
.card.bad { border-color:rgba(239,68,68,.45); }
h1 { font-size:1.375rem; margin:0; }
p { margin:0; color:var(--mut); }
p.err { display:flex; gap:.625rem; padding:.625rem .75rem; border-radius:.75rem; background:var(--badbg); color:var(--bad); }
p.done { display:flex; gap:.625rem; padding:.625rem .75rem; border-radius:.75rem; background:var(--okbg); color:var(--ok); }
form { display:flex; flex-direction:column; gap:.75rem; }
label { font-size:.8rem; color:var(--mut); }
input { width:100%; height:3.5rem; padding:0 .875rem; border:1px solid var(--line); border-radius:.75rem; background:var(--field); color:var(--fg); font:1.375rem ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; letter-spacing:.18em; text-transform:uppercase; text-align:center; }
input:focus { outline:2px solid var(--accent); outline-offset:1px; border-color:transparent; }
button { width:100%; height:3rem; border:0; border-radius:.75rem; background:var(--accent); color:#fff; font:inherit; font-size:1rem; font-weight:600; cursor:pointer; }
.hint { display:flex; gap:.5rem; font-size:.85rem; }
.hint svg { flex-shrink:0; margin-top:.15rem; color:var(--warn); }
.foot { margin-top:1.25rem; font-size:.8rem; text-align:center; }
</style>
</head>
<body>
<div class="brand">
<span class="tile" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M5 12a7 7 0 0 1 2-5M19 12a7 7 0 0 1-2 5M3 12a9 9 0 0 1 3-6.7M21 12a9 9 0 0 1-3 6.7"/></svg></span>
<div><b>ReCasaOS</b><span>{{.Host}}</span></div>
</div>
<div class="card{{if .IsError}} bad{{end}}">
<h1>{{.Title}}</h1>
{{if .Message}}<p{{if .IsError}} class="err" role="alert"{{else}} class="done"{{end}}>{{.Message}}</p>{{end}}
{{if .Form}}<form method="post">
<label for="code">{{.Label}}</label>
<input id="code" name="code" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="32" required autofocus>
<button type="submit">{{.Button}}</button>
<p class="hint"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 9v4M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg><span>{{.Hint}}</span></p>
</form>{{end}}
</div>
</body>
</html>
