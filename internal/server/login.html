<!doctype html>
<html lang="{{.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
{{.Marker}}
<style>
body{font-family:system-ui,sans-serif;max-width:24rem;margin:3rem auto;padding:0 1rem;line-height:1.5}
input,button{font-size:1.25rem;padding:.5rem;width:100%;box-sizing:border-box;margin-top:.5rem}
input{text-transform:uppercase;letter-spacing:.1em}
.err{color:#b00020}
</style>
</head>
<body>
<h1>{{.Title}}</h1>
{{if .Message}}<p{{if .IsError}} class="err" role="alert"{{end}}>{{.Message}}</p>{{end}}
{{if .Form}}<form method="post">
<label for="code">{{.Label}}</label>
<input id="code" name="code" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="32" required autofocus>
<button type="submit">{{.Button}}</button>
<p>{{.Hint}}</p>
</form>{{end}}
</body>
</html>
