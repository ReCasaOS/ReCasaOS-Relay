# DERP: the relay is a standalone `derper` (Headscale's embedded DERP is off, see headscale/config.yaml),
# so its per-connection byte counters can be metered. Headscale's DERP map (headscale/derp.yaml, which an
# operator replaces with their own host through an override, docs/self-hosting.md) sends boxes to /derp on the public host, which `front` proxies to derper; only its STUN port is published.
# derper admits a node only if Headscale's /verify knows its key, and refuses everyone when Headscale
# cannot be reached (fail-closed).

# Docker's log of a container, capped at 3 files of 10 MB (by size, not by age).
x-capped-logs: &capped-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  headscale:
    image: headscale/headscale:v0.29.7
    command: serve
    restart: unless-stopped
    volumes:
      - ./headscale/config.yaml:/etc/headscale/config.yaml:ro
      - ./headscale/derp.yaml:/etc/headscale/derp.yaml:ro
      - headscale-data:/var/lib/headscale
    # Nothing is published. The control plane on 8080 is published through `front`, which hides the admin
    # REST API (/api/); the gRPC API (50443) is never published. `enrolment` reaches the REST API and
    # `derper` reaches /verify directly on the compose network.

  derper:
    build: ./derper
    restart: unless-stopped
    depends_on:
      - headscale
    command: -a :8090 -http-port -1 -stun-port 3478 -verify-client-url http://headscale:8080/verify -verify-client-url-fail-open=false
    environment:
      # /debug/ answers only with ?debugkey=<this file's content, trimmed>; DERPER_DEBUG_KEY unset: the file
      # holds a lone newline, which never matches (see the `configs:` entry at the end).
      TS_DEBUG_KEY_PATH: /run/derper-debug-key
    configs:
      - source: derper-debug-key
        target: /run/derper-debug-key
    # Plain HTTP, reached only through `front` (/derp) and by `enrolment` (/debug/clients/): never publish it.
    expose:
      - "8090"
    ports:
      - "3478:3478/udp"

  front:
    image: caddy:2.10.0-alpine
    restart: unless-stopped
    depends_on:
      - headscale
      - derper
      - enrolment
    # Its access log goes to `enrolment` (port 8083, the Caddyfile's `(journal)`), which keeps it in its journal.
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    # Docker's log of the container is capped: its output carries client addresses (front prints its access
    # log there while `enrolment` cannot take it).
    logging: *capped-logs
    # Plain HTTP: put your TLS reverse proxy in front of this port (it serves Headscale and /v1/*).
    # With public sharing, 80/443 move to `share` and this list is emptied by the docs override (docs/self-hosting.md, section 14).
    ports:
      - "8080:8080"

  enrolment:
    build: .
    # To run the published image instead of building: see "Using the published image" in docs/self-hosting.md.
    restart: unless-stopped
    depends_on:
      - headscale
    environment:
      HEADSCALE_URL: http://headscale:8080
      # Required: create it with `docker compose exec headscale headscale apikeys create`, then put it in .env.
      HEADSCALE_API_KEY: ${HEADSCALE_API_KEY:-}
      STORE_PATH: /data/relay.db
      # Set by the `front` Caddy (header_up, replacing any client value). Port 8081 is never published.
      TRUSTED_PROXY_HEADER: ${TRUSTED_PROXY_HEADER-X-Client-IP}
      LOGIN_SERVER: ${LOGIN_SERVER:-}
      NODES_PER_FLEET: ${NODES_PER_FLEET:-50}
      MAX_FLEETS: ${MAX_FLEETS:-1000}
      MAX_FLEETS_PER_ORIGIN: ${MAX_FLEETS_PER_ORIGIN:-10}
      MAX_FLEETS_PER_PREFIX48: ${MAX_FLEETS_PER_PREFIX48:-30}
      MAX_PENDING_KEYS: ${MAX_PENDING_KEYS:-5}
      CREATE_RATE_PER_HOUR: ${CREATE_RATE_PER_HOUR:-5}
      KEY_RATE_PER_HOUR: ${KEY_RATE_PER_HOUR:-30}
      AUTH_RATE_PER_HOUR: ${AUTH_RATE_PER_HOUR:-60}
      DEVICE_CODE_TTL: ${DEVICE_CODE_TTL:-10m}
      MAX_PENDING_DEVICE_CODES: ${MAX_PENDING_DEVICE_CODES:-5}
      MAX_DEVICES_PER_FLEET: ${MAX_DEVICES_PER_FLEET:-50}
      LOGIN_RATE_PER_HOUR: ${LOGIN_RATE_PER_HOUR:-20}
      JOIN_KEY_TTL: ${JOIN_KEY_TTL:-24h}
      IDLE_AFTER: ${IDLE_AFTER:-720h}
      GC_INTERVAL: ${GC_INTERVAL:-10m}
      # Optional operator page at /admin (24+ characters). Unset: /admin answers 404.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # Optional traffic metering from the derper. DERPER_DEBUG_KEY unset: metering is off.
      DERPER_URL: ${DERPER_URL:-http://derper:8090}
      DERPER_DEBUG_KEY: ${DERPER_DEBUG_KEY:-}
      # Monthly traffic budget shown on /admin, e.g. 100G, 100GB or 2t (K, M, G, T are decimal, any case). Unset: no reference.
      MONTHLY_TRAFFIC_REFERENCE: ${MONTHLY_TRAFFIC_REFERENCE:-}
      # Protection requests of the boxes (protection, bans, refusals) per hour per client IP, apart from AUTH_RATE_PER_HOUR.
      PROTECT_RATE_PER_HOUR: ${PROTECT_RATE_PER_HOUR:-600}
      # Protection of shared apps (only with SHARE_DOMAIN): total entries of the enabled lists; a list past it is refused whole.
      FILTER_MAX_ENTRIES: ${FILTER_MAX_ENTRIES:-1000000}
      # Age a fleet needs before its ban reports count. For tests only: keep the default in production.
      COMMUNITY_MIN_FLEET_AGE: ${COMMUNITY_MIN_FLEET_AGE:-168h}
      # The caps `share` enforces, read here only to show them on /admin: keep them equal to share's below.
      CONNS_PER_IP: ${CONNS_PER_IP:-256}
      CONNS_PER_IP_PER_BOX: ${CONNS_PER_IP_PER_BOX:-64}
      # Journal: days kept (at most 168h) and the size cap, in bytes, of each of its two journals (its own, front's).
      LOG_KEEP: ${LOG_KEEP:-168h}
      LOG_MAX_SIZE: ${ENROLMENT_LOG_MAX_SIZE:-268435456}
      # Set empty in .env: no journal (ENROLMENT_LOG_DIR), or no front access log (LOG_INGEST_ADDR). Either way also
      # remove `import journal` from the Caddyfile, or front prints its access log on its own output instead.
      LOG_DIR: ${ENROLMENT_LOG_DIR-/data/logs}
      LOG_INGEST_ADDR: ${LOG_INGEST_ADDR-:8083}
    volumes:
      - enrolment-data:/data
      # share's log, read for /admin/journal (enrolment's own and front's are in /data/logs).
      - share-logs:/logs/share:ro
    # Reached only through `front` (Caddyfile): never publish this port, the rate limiter trusts X-Client-IP.
    # 8083 takes front's access log (LOG_INGEST_ADDR, empty: off); never publish nor route it either.
    expose:
      - "8081"
      - "8083"
    # With SHARE_DOMAIN set it also serves the delegated DNS zone on 53 (UDP and TCP; SHARE_PUBLIC_IP required).
    # Port 53 is published only by the `compose.share.yaml` override of the docs (docs/self-hosting.md, section 14),
    # on the public IP explicitly (<ip>:53:53/udp and /tcp), never on 0.0.0.0: systemd-resolved holds 127.0.0.53:53.
    # The SHARE_* variables are set by that override too.
    stop_grace_period: 40s # in-flight create-fleet calls may take up to 30 s
    # Capped like front's: its output carries client addresses too.
    logging: *capped-logs

  # Optional (docker compose --profile share): reads the TLS server name on 80/443 and forwards to `front`
  # (or, for shared boxes, into their tunnel). In production its ports are 80/443 and the `front` ports move
  # here (the docs override, docs/self-hosting.md section 14, does that and also clears the profile); never publish them from both.
  # Port 8082 (tunnels) is never published: only `front` reaches it.
  share:
    build:
      context: .
      args:
        CMD: share
    profiles: ["share"]
    restart: unless-stopped
    depends_on:
      - front
      - enrolment
    environment:
      LISTEN_TLS: ":443"
      LISTEN_HTTP: ":80"
      LISTEN_TUNNEL: ":8082"
      FRONT_TLS: front:443
      FRONT_HTTP: front:80
      ENROLMENT_URL: http://enrolment:8081
      RELAY_HOST: ${RELAY_HOST:-}
      SHARE_DOMAIN: ${SHARE_DOMAIN:-}
      PEEK_TIMEOUT: ${PEEK_TIMEOUT:-5s}
      FRONT_PROXY_PROTOCOL: ${FRONT_PROXY_PROTOCOL:-true}
      TUNNEL_RATE_PER_HOUR: ${TUNNEL_RATE_PER_HOUR:-60}
      CONNS_PER_IP: ${CONNS_PER_IP:-256}
      CONNS_PER_IP_PER_BOX: ${CONNS_PER_IP_PER_BOX:-64}
      # Journal: days kept (at most 168h) and the size cap of share's log files, in bytes.
      LOG_KEEP: ${LOG_KEEP:-168h}
      LOG_MAX_SIZE: ${SHARE_LOG_MAX_SIZE:-1073741824}
      # Set empty in .env: no journal.
      LOG_DIR: ${SHARE_LOG_DIR-/logs}
    volumes:
      - share-logs:/logs
    # ports:
    #   - "80:80"
    #   - "443:443"
    stop_grace_period: 40s
    # Capped like front's: its output carries client addresses too.
    logging: *capped-logs

volumes:
  headscale-data:
  enrolment-data:
  share-logs:

configs:
  derper-debug-key:
    # Never empty: compose turns an empty `content` into a bind mount of its working directory (with .env).
    # CI checks this renders as content, never as a file.
    content: "${DERPER_DEBUG_KEY:-}\n"
