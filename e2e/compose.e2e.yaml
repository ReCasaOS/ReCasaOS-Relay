# Test-only override for e2e/isolation_test.go; never use it in production.
#   docker compose -p <name> -f compose.yaml -f e2e/compose.e2e.yaml up -d
#
# The tailscale client insists on a TLS control connection (port 443), so the test network gets a
# second Caddy, `tlsfront` (behind `share`, which owns the name relay.test here), that answers to relay.test with a certificate from Caddy's own CA and
# forwards to the real, unchanged `front`. The test installs that CA in its tailscale containers.
services:
  headscale:
    environment:
      HEADSCALE_SERVER_URL: https://relay.test # overrides server_url of headscale/config.yaml
    # The DERP map points at relay.test instead of relay.example.org.
    volumes: !override
      - ./headscale/config.yaml:/etc/headscale/config.yaml:ro
      - ./e2e/derp.e2e.yaml:/etc/headscale/derp.yaml:ro
      - headscale-data:/var/lib/headscale
    # Random loopback ports only (no clash with a running relay); the test reads the admin API there.
    ports: !override
      - "127.0.0.1::8080"

  # DERPER_DEBUG_KEY comes from the test's environment (newRig).
  derper:
    ports: !override
      - "127.0.0.1::3478/udp"

  front:
    ports: !override
      - "127.0.0.1::8080"

  enrolment:
    networks:
      default:
        ipv4_address: 172.29.0.11 # Pebble's -dnsserver
    environment:
      SHARE_DOMAIN: box.relay.test
      SHARE_PUBLIC_IP: 172.29.0.10 # `share`, below
      LOGIN_SERVER: https://relay.test
      ADMIN_TOKEN: e2e-admin-token-0123456789abcdef
      AUTH_RATE_PER_HOUR: "1000"
      KEY_RATE_PER_HOUR: "100"
      COMMUNITY_MIN_FLEET_AGE: 1s # fresh test fleets may report bans

    # The test reads the zone through these (random loopback ports, nothing on 53 of the host).
    ports:
      - "127.0.0.1::53/udp"
      - "127.0.0.1::53/tcp"

  # ACME test server: validates DNS-01 only through enrolment's zone.
  pebble:
    image: ghcr.io/letsencrypt/pebble:2.10.1
    command: ["-config", "/test/config/pebble-config.json", "-dnsserver", "172.29.0.11:53"]
    environment:
      PEBBLE_VA_NOSLEEP: "1"
    depends_on:
      - enrolment
    ports:
      - "127.0.0.1::14000"
      - "127.0.0.1::15000"

  tlsfront:
    image: caddy:2.10.0-alpine
    depends_on:
      - front
    volumes:
      - ./e2e/Caddyfile.tls:/etc/caddy/Caddyfile:ro

  # Always on in the test network: the tunnel and sharing tests go through it.
  share:
    build:
      context: .
      args:
        CMD: share
    profiles: !reset []
    depends_on:
      - front
      - enrolment
      - tlsfront
    environment:
      RELAY_HOST: relay.test
      SHARE_DOMAIN: box.relay.test
      FRONT_TLS: tlsfront:443
      FRONT_HTTP: tlsfront:80
    ports:
      - "127.0.0.1::443"
      - "127.0.0.1::80"
      - "127.0.0.1::8082"
    networks:
      default:
        ipv4_address: 172.29.0.10 # SHARE_PUBLIC_IP of enrolment: the zone answers with it
        aliases:
          - share.relay.test
          - relay.test # the tailscale containers reach the relay through share
      visitors:
        ipv4_address: 198.51.100.10

networks:
  default:
    ipam:
      config:
        - subnet: 172.29.0.0/24
  # Visitor containers with a public-looking address (TEST-NET-2): share keeps no private address in its
  # filter or events. Internal, so share's default route stays on `default`.
  visitors:
    internal: true
    ipam:
      config:
        - subnet: 198.51.100.0/24
